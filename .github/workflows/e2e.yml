name: E2E

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET
        run: dotnet restore modern/QualitySmartAssistant.sln

      - name: Build backend
        run: dotnet build modern/QualitySmartAssistant.sln --no-restore -c Release

      - name: Install frontend dependencies
        working-directory: modern/client
        run: npm install

      - name: Install Playwright Chromium
        working-directory: modern/client
        run: npx playwright install chromium --with-deps

      - name: Run E2E (start API + frontend, run Playwright)
        working-directory: modern/client
        run: node scripts/run-e2e-local.cjs
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: modern/client/playwright-report/
          retention-days: 7
