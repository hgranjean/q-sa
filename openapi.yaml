openapi: 3.0.3
info:
  title: Survey MVP API
  version: 1.0.0
  description: |
    Initial MVP contract for modernized Survey application.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Surveys
  - name: Assignments
  - name: Responses
  - name: Reports
paths:
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
              examples:
                sample:
                  value:
                    id: usr_01JQ8T0B1T1R9D3YQ5K2P9V8M4
                    email: manager@hospital.org
                    displayName: Jordan Smith
                    roles: [Manager]
                    hospitalIds: [hos_01JQ8SYR8W8N7Q4R3P2C1B0A9Z]
                    permissions: [reports.read, responses.read]
                    lastLoginUtc: '2026-02-18T20:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /surveys:
    post:
      tags: [Surveys]
      summary: Create a draft survey with question groups and questions
      operationId: createSurvey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /surveys/{surveyId}/publish:
    post:
      tags: [Surveys]
      summary: Publish a draft survey
      operationId: publishSurvey
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishSurveyRequest'
      responses:
        '200':
          description: Survey published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSurveyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assignments:
    post:
      tags: [Assignments]
      summary: Assign a published survey to a hospital and assignee
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /responses:
    post:
      tags: [Responses]
      summary: Create survey response, save answers, and optionally submit
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
      responses:
        '201':
          description: Response created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/completion:
    get:
      tags: [Reports]
      summary: Get completion report by date range and optional hospital
      operationId: getCompletionReport
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/HospitalIdQuery'
      responses:
        '200':
          description: Completion report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema:
        type: string
      example: srv_01JQ8V9Y7E3W2M1N0K9J8H7G6F
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2026-03-01'
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2026-03-31'
    HospitalIdQuery:
      name: hospitalId
      in: query
      required: false
      schema:
        type: string
      example: hos_01JQ8SYR8W8N7Q4R3P2C1B0A9Z

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AuthMeResponse:
      type: object
      required: [id, email, displayName, roles, hospitalIds, permissions, lastLoginUtc]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        hospitalIds:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        lastLoginUtc:
          type: string
          format: date-time

    CreateSurveyRequest:
      type: object
      required: [title, questionGroups]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        effectiveFromUtc:
          type: string
          format: date-time
        effectiveToUtc:
          type: string
          format: date-time
        questionGroups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuestionGroupInput'

    QuestionGroupInput:
      type: object
      required: [title, sortOrder, questions]
      properties:
        title:
          type: string
          maxLength: 200
        sortOrder:
          type: integer
          minimum: 1
        questions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuestionInput'

    QuestionInput:
      type: object
      required: [code, text, type, isRequired, sortOrder]
      properties:
        code:
          type: string
          maxLength: 50
        text:
          type: string
          maxLength: 2000
        type:
          type: string
          enum: [YesNo, Number, Text, SingleChoice, MultiChoice]
        isRequired:
          type: boolean
        sortOrder:
          type: integer
          minimum: 1

    SurveyCreatedResponse:
      type: object
      required: [id, status, title, version, createdByUserId, createdAtUtc]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [Draft, Published, Archived]
        title:
          type: string
        description:
          type: string
        effectiveFromUtc:
          type: string
          format: date-time
        effectiveToUtc:
          type: string
          format: date-time
        version:
          type: integer
        createdByUserId:
          type: string
        createdAtUtc:
          type: string
          format: date-time

    PublishSurveyRequest:
      type: object
      required: [publishNotes]
      properties:
        publishNotes:
          type: string
          maxLength: 1000

    PublishSurveyResponse:
      type: object
      required: [id, status, publishedAtUtc, publishedByUserId, version]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [Published]
        publishedAtUtc:
          type: string
          format: date-time
        publishedByUserId:
          type: string
        version:
          type: integer

    CreateAssignmentRequest:
      type: object
      required: [surveyId, hospitalId, assigneeUserId, dueAtUtc, priority]
      properties:
        surveyId:
          type: string
        hospitalId:
          type: string
        assigneeUserId:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        priority:
          type: string
          enum: [Low, Normal, High]

    AssignmentCreatedResponse:
      type: object
      required: [id, surveyId, hospitalId, assigneeUserId, status, dueAtUtc, createdAtUtc]
      properties:
        id:
          type: string
        surveyId:
          type: string
        hospitalId:
          type: string
        assigneeUserId:
          type: string
        status:
          type: string
          enum: [Assigned, InProgress, Submitted, Overdue]
        dueAtUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time

    CreateResponseRequest:
      type: object
      required: [assignmentId, answers, submit]
      properties:
        assignmentId:
          type: string
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnswerInput'
        submit:
          type: boolean

    AnswerInput:
      type: object
      required: [questionCode]
      properties:
        questionCode:
          type: string
        value:
          oneOf:
            - type: boolean
            - type: number
            - type: string
            - type: array
              items:
                type: string
        comment:
          type: string
          maxLength: 1000

    ResponseCreatedResponse:
      type: object
      required: [id, assignmentId, status]
      properties:
        id:
          type: string
        assignmentId:
          type: string
        status:
          type: string
          enum: [Draft, Submitted]
        score:
          $ref: '#/components/schemas/Score'
        submittedAtUtc:
          type: string
          format: date-time
        submittedByUserId:
          type: string

    Score:
      type: object
      required: [max, achieved, percent]
      properties:
        max:
          type: number
        achieved:
          type: number
        percent:
          type: number
          format: double

    CompletionReportResponse:
      type: object
      required: [from, to, totals, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        hospitalId:
          type: string
        totals:
          $ref: '#/components/schemas/CompletionTotals'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompletionItem'

    CompletionTotals:
      type: object
      required: [assigned, inProgress, submitted, overdue, completionRatePercent]
      properties:
        assigned:
          type: integer
        inProgress:
          type: integer
        submitted:
          type: integer
        overdue:
          type: integer
        completionRatePercent:
          type: number
          format: double

    CompletionItem:
      type: object
      required: [assignmentId, surveyId, surveyTitle, hospitalId, assigneeUserId, dueAtUtc, status]
      properties:
        assignmentId:
          type: string
        surveyId:
          type: string
        surveyTitle:
          type: string
        hospitalId:
          type: string
        assigneeUserId:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        status:
          type: string
          enum: [Assigned, InProgress, Submitted, Overdue]
        submittedAtUtc:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: One or more validation errors occurred.
            details:
              type: array
              items:
                type: string
